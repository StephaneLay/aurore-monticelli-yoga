<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__marque marque">
      <span class="marque__nom">{{t:site.nom}}</span>
      <span class="marque__discipline">{{t:site.discipline}}</span>
    </p>
    <p class="site-footer__adresse">{{t:contact.adresse}}<br>{{t:contact.metroLabel}} {{t:contact.metro}}</p>
    <a class="site-footer__lien" href="{{p:contact}}">{{t:contact.titre}}</a>
    <p class="site-footer__droits">© <span data-annee>2026</span> {{t:site.nom}} {{t:site.discipline}}</p>
  </div>
</footer>
<script src="{{ROOT}}js/main.js" defer></script>
<script src="{{ROOT}}js/propositions.js" defer></script>
