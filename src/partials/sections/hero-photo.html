<section class="hero hero--photo" id="accueil" data-section>
  <div class="soleil" aria-hidden="true"></div>
  <div class="hero__texte">
    <p class="surtitre hero__lieu">{{t:hero.lieu}}</p>
    <h1 class="hero__titre">{{t:hero.titre}}</h1>
    <ul class="hero__styles">
      <li>{{t:hero.style1}}</li>
      <li>{{t:hero.style2}}</li>
    </ul>
    <a class="bouton" href="{{p:cours}}">{{t:hero.cta}}</a>
  </div>
  <figure class="hero__visuel">
    <img src="{{ROOT}}images/yin-1400.webp" srcset="{{ROOT}}images/yin-800.webp 800w, {{ROOT}}images/yin-1400.webp 1400w, {{ROOT}}images/yin-2200.webp 2200w" sizes="(min-width: 900px) 60vw, 100vw" alt="{{t:images.yin}}" width="1400" height="990" fetchpriority="high">
  </figure>
</section>
