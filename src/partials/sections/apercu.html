<section class="section apercu" id="apercu" data-section>
  <div class="conteneur apercu__grille">
    <article class="carte-cours" data-reveal>
      <p class="surtitre">{{t:vinyasa.rythme}}</p>
      <h2 class="carte-cours__titre">{{t:vinyasa.titre}}</h2>
      <p class="carte-cours__texte">{{t:vinyasa.p1}}</p>
      <ul class="creneaux" aria-label="{{t:creneaux.label}}">
        <li class="creneau"><span class="creneau__jour">{{t:vinyasa.jour1}}</span> <span class="creneau__heure">{{t:vinyasa.heure1}}</span></li>
        <li class="creneau"><span class="creneau__jour">{{t:vinyasa.jour2}}</span> <span class="creneau__heure">{{t:vinyasa.heure2}}</span></li>
      </ul>
      <a class="lien-fleche" href="{{p:cours}}#vinyasa">{{t:hero.cta}}</a>
    </article>
    <article class="carte-cours carte-cours--yin" data-reveal>
      <p class="surtitre">{{t:yin.rythme}}</p>
      <h2 class="carte-cours__titre">{{t:yin.titre}}</h2>
      <p class="carte-cours__texte">{{t:yin.p1}}</p>
      <ul class="creneaux" aria-label="{{t:creneaux.label}}">
        <li class="creneau"><span class="creneau__jour">{{t:yin.jour1}}</span> <span class="creneau__heure">{{t:yin.heure1}}</span></li>
      </ul>
      <a class="lien-fleche" href="{{p:cours}}#yin">{{t:hero.cta}}</a>
    </article>
  </div>
</section>
